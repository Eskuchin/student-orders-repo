spring.application.name=StudentOrders

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/student_orders
spring.datasource.username=studentuser
spring.datasource.password=studentpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# MySQL dialect (optional but recommended)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect